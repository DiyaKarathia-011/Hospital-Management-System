<div class="dashboard-container">

    <h2>Doctor Dashboard</h2>

    <!-- STAT CARDS -->
    <div class="card-grid">

        <div class="card">
            <h4>Total Appointments</h4>
            <p>{{ totalAppointments }}</p>
        </div>

        <div class="card">
            <h4>Today Appointments</h4>
            <p>{{ todayAppointments.length }}</p>
        </div>

        <div class="card">
            <h4>Completed</h4>
            <p>{{ completedCount }}</p>
        </div>

        <div class="card">
            <h4>Pending</h4>
            <p>{{ pendingCount }}</p>
        </div>

    </div>

    <!-- TODAY APPOINTMENTS TABLE -->
    <div class="table-section">
        <h3>Today's Appointments</h3>

        <table>
            <thead>
                <tr>
                    <th>Patient</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let appt of todayAppointments">
                    <td>{{ appt.patientName }}</td>
                    <td>{{ appt.date }}</td>

                    <td [ngClass]="{
        'status-pending': appt.status === 'Pending',
        'status-completed': appt.status === 'Completed'
      }">
                        {{ appt.status }}
                    </td>

                    <td>
                        <button *ngIf="appt.status === 'Pending'" class="complete-btn" (click)="markCompleted(appt)">
                            Complete
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
