<div class="page">
  <h2 class="title">Departments</h2>

  <div class="card-container">

    <div class="card" *ngFor="let dept of departmentList">

      <div class="icon">
        {{ getIcon(dept.departmentName) }}
      </div>

      <h3>{{ dept.departmentName }}</h3>
      <p>{{ dept.description }}</p>

    </div>

  </div>
</div>
